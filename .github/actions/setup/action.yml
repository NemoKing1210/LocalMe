name: Setup LocalMe
description: Install Node, Rust, caches, and Linux packages needed to build LocalMe

inputs:
  node:
    description: Install Node.js from .nvmrc
    default: 'true'
  rust:
    description: Install the Rust toolchain from rust-toolchain.toml
    default: 'true'
  rust-targets:
    description: Extra rustup targets (comma-separated)
    default: ''
  frontend:
    description: Install npm dependencies with npm ci
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install Rust
      if: inputs.rust == 'true'
      # Not pinned to a commit on purpose: this action's ref *is* the toolchain it installs
      # (`@stable`, `@1.85`), so a SHA would stop it selecting one. `rust-toolchain.toml` pins
      # the actual version.
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Cache Rust build
      if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        workspaces: src-tauri -> target
        cache-on-failure: true

    - name: Install Linux build dependencies
      if: runner.os == 'Linux' && inputs.rust == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          patchelf \
          libssl-dev \
          libxdo-dev \
          xdg-utils

    - name: Install frontend dependencies
      if: inputs.frontend == 'true'
      shell: bash
      run: npm ci --no-audit --no-fund
