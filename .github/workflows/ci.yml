name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Front end
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: 'false'

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # The threshold in `vite.config.ts` is what makes the number a gate rather than a report;
      # the lcov file the step leaves behind is what a reviewer reads.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # The Rust jobs run on all three platforms: most of this project's risk is platform behaviour —
  # mDNS per interface, tray availability, firewall prompts — and a check that only ever passes on
  # Linux would tell us nothing about the two platforms most users are on.
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: 'false'
          frontend: 'false'

      - name: Format
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: src-tauri

      # The unit tests are pure and fast; the integration tests bind loopback sockets and run two
      # full instances with discovery injected, so they are deterministic.
      - name: Tests
        run: cargo test --workspace
        working-directory: src-tauri

      # The real-mDNS test is opt-in because it needs multicast to work between two daemons inside
      # one process, which depends on the machine's interfaces. It runs here so the result is
      # visible, and it is advisory: a runner that filters multicast is a fact about the runner,
      # not about the code.
      - name: Discovery over real multicast (advisory)
        run: cargo test -p localme-core --test loopback -- --ignored
        working-directory: src-tauri
        continue-on-error: true

  # Rust coverage on one platform only: the number is a property of the code, and the three
  # platforms already run the whole suite. `--fail-under-lines` makes it a gate rather than a
  # report, the same shape as the front end's coverage step.
  coverage:
    name: Rust coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          node: 'false'
          frontend: 'false'

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Measure
        # Library targets only: the inline `#[cfg(test)]` modules and the unit suite are
        # deterministic, while the two-instance loopback suite is timing-sensitive under
        # instrumentation — and the `core` job already runs it, on three platforms.
        run: cargo llvm-cov --workspace --lib --fail-under-lines 85
        working-directory: src-tauri

  versions:
    name: Versions
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          rust: 'false'
          frontend: 'false'

      - name: Check version sync
        run: npm run check:versions

      - name: Test the version tooling
        run: npm run test:scripts

  ci:
    name: CI
    needs: [frontend, core, coverage, versions]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every check
        run: |
          test '${{ needs.frontend.result }}' = success
          test '${{ needs.core.result }}' = success
          test '${{ needs.coverage.result }}' = success
          test '${{ needs.versions.result }}' = success
