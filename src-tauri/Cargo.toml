[package]
name = "localme"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LocalMe — a zero-configuration messenger for the local network"
license = "MIT"
publish = false

[workspace]
members = [".", "core"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
  "io-util",
  "fs",
] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }

[lib]
name = "localme"
path = "src/lib.rs"

[[bin]]
name = "localme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
localme-core = { path = "core" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-notification = "2.5.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false
