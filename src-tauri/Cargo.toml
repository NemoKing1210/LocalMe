[package]
name = "localme"
version = "0.9.0"
edition = "2024"
rust-version = "1.85"
description = "LocalMe — a zero-configuration messenger for the local network"
license = "MIT"
publish = false

[workspace]
members = [".", "core"]
resolver = "3"

[workspace.dependencies]
base64 = "0.22.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "sync",
  "time",
  "io-util",
  "fs",
] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }

[lib]
name = "localme"
path = "src/lib.rs"

[[bin]]
name = "localme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
localme-core = { path = "core" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.12.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-single-instance = "2.5.1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.23.0"

[features]
# Without this the front end is loaded from `devUrl`, which is what `tauri dev` wants and what
# any standalone binary must not do. The Tauri CLI enables it for release builds; declaring it
# here is what lets `cargo build --features custom-protocol` produce a self-contained binary,
# which is how the two-instance check in the README is run.
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# The WebView2 settings object, for the one piece of browser policy a page cannot express — see
# `src/webview.rs`. `webview2-com` is pinned to the revision `wry` already links, because the
# controller handle `with_webview` hands out is that crate's type, not a lookalike.
webview2-com = "0.39"
windows-core = "0.62"
# The window frame. Windows 11 colours a title bar from `DWMWA_CAPTION_COLOR`, and the attribute
# has no Tauri wrapper, so it is set directly; this is the same `windows` version `tauri` links,
# which is what makes `Window::hwnd` the `HWND` the call wants. See `src/window.rs`.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
incremental = false
